<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b71c1c"/>
      <stop offset="100%" stop-color="#e53935"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g transform="translate(256 256) scale(5.2) translate(-32 -32)">
    <!-- ears outer -->
    <path fill="#0d0d0d" d="M10 30 L16 6 L26 24 Z"/>
    <path fill="#0d0d0d" d="M54 30 L48 6 L38 24 Z"/>
    <!-- inner ear -->
    <path fill="#3a1414" d="M18 12 L22 18 L20 22 Z"/>
    <path fill="#3a1414" d="M46 12 L42 18 L44 22 Z"/>
    <!-- face -->
    <ellipse cx="32" cy="38" rx="22" ry="20" fill="#0d0d0d"/>
    <!-- eyes -->
    <ellipse cx="23" cy="36" rx="3.2" ry="5.5" fill="#ffe066"/>
    <ellipse cx="41" cy="36" rx="3.2" ry="5.5" fill="#ffe066"/>
    <ellipse cx="23" cy="36" rx="1" ry="4" fill="#0d0d0d"/>
    <ellipse cx="41" cy="36" rx="1" ry="4" fill="#0d0d0d"/>
    <circle cx="22" cy="34" r="0.8" fill="white"/>
    <circle cx="40" cy="34" r="0.8" fill="white"/>
    <!-- nose -->
    <path d="M30 44 L32 46 L34 44 Z" fill="#ff8a9a"/>
    <!-- mouth -->
    <path d="M28 47 Q32 51 36 47" stroke="#3a3a3a" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <!-- whiskers -->
    <line x1="6" y1="38" x2="18" y2="40" stroke="#5a5a5a" stroke-width="0.8"/>
    <line x1="6" y1="42" x2="18" y2="42" stroke="#5a5a5a" stroke-width="0.8"/>
    <line x1="46" y1="40" x2="58" y2="38" stroke="#5a5a5a" stroke-width="0.8"/>
    <line x1="46" y1="42" x2="58" y2="42" stroke="#5a5a5a" stroke-width="0.8"/>
  </g>
  <!-- 鑫 character (subtle) -->
  <text x="256" y="450" font-family="system-ui, sans-serif" font-size="44" font-weight="900" fill="rgba(255,255,255,0.5)" text-anchor="middle">鑫越</text>
</svg>
